name: UptimeRobot - Gece Sonu Baslat (04:00 TRT)

# Turkiye UTC+3'te sabit (DST yok) - 04:00 TRT = 01:00 UTC (ayni gun).
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch: {}

jobs:
  resume:
    runs-on: ubuntu-latest
    # Secret'lar repo-level degil, "a" environment'ina bagli eklendi -
    # GitHub Actions environment-scoped secret'lari sadece bunu ACIKCA
    # belirten job'lara acar.
    environment: a
    steps:
      - name: Servisi nazikce uyandir, UptimeRobot'u aktive etmeden ONCE saglikli oldugunu dogrula
        run: |
          # UptimeRobot monitoru aktive edilir edilmez genelde birden fazla
          # bolgeden ES ZAMANLI ilk kontrolu atiyor (bkz. 2026-08-24
          # "hibernate-wake-error" olayindaki suphe). Servis hala soguk
          # baslangictaysa, bu patlama tam o sirada gercek bir kullanicinin
          # attigi paralel isteklerle (bazi SSR sayfalari tek yuklemede
          # 17+ paralel backend istegi atiyor) cakisip Render'in asiri
          # eszamanli istegi 429 ile reddetmesine yol acabiliyor (bkz.
          # 2026-08-27 /auth/me 429 olayi). Bu yuzden monitoru aktive
          # etmeden ONCE, TEK kaynaktan (bu adimdan), seyrek araliklarla
          # servisi kendimiz uyandirip saglikli oldugunu dogruluyoruz -
          # istek sayisi/sikligi artmiyor, sadece UptimeRobot'un kendi
          # cok-bolgeli patlamasiyla cakismamasi icin sıralama degisiyor.
          URL="https://isletme-yonetim.onrender.com/health"
          SERVICE_ID="srv-d9f5kggk1i2s73bfsgtg"

          wait_healthy() {
            local attempts="$1"
            local i
            for i in $(seq 1 "$attempts"); do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$URL" || echo "000")
              echo "Deneme $i/$attempts: HTTP $status"
              if [ "$status" = "200" ]; then
                return 0
              fi
              sleep 30
            done
            return 1
          }

          if wait_healthy 12; then
            echo "Servis saglikli, ek islem gerekmiyor."
            exit 0
          fi

          echo "Servis ~6 dakika icinde ayaga kalkmadi, Render uzerinden restart tetikleniyor."
          restart_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://api.render.com/v1/services/${SERVICE_ID}/restart" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")
          echo "Render restart istegi HTTP $restart_status dondu"

          if [ "$restart_status" -ge 300 ]; then
            echo "Render restart istegi basarisiz oldu"
            exit 1
          fi

          if wait_healthy 10; then
            echo "Restart sonrasi servis saglikli."
            exit 0
          fi

          echo "Restart sonrasinda da servis ayaga kalkmadi - manuel mudahale gerekiyor."
          exit 1

      - name: UptimeRobot monitorunu yeniden baslat
        # Onceki adim basarisiz olsa bile (servis hic ayaga kalkmadiysa)
        # izlemeyi/alarmlari yine de aktive edelim - is akisinin genel
        # sonucu yine de "failure" olarak isaretlenir (onceki adim exit 1
        # dondugu icin), sadece alarm mekanizmasi devre disi kalmaz.
        if: always()
        run: |
          response=$(curl -s -X POST https://api.uptimerobot.com/v2/editMonitor \
            -d "api_key=${{ secrets.UPTIMEROBOT_API_KEY }}" \
            -d "id=${{ secrets.UPTIMEROBOT_MONITOR_ID }}" \
            -d "status=1" \
            -d "format=json")
          echo "$response"
          echo "$response" | grep -q '"stat":"ok"' || (echo "UptimeRobot API basarisiz oldu" && exit 1)
