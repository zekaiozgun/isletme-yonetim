name: UptimeRobot - Gece Duraklat (20:00 TRT)

# Turkiye UTC+3'te sabit (DST yok) - 20:00 TRT = 17:00 UTC (ayni gun).
# 2026-08-28: pencere 01:00-04:00 TRT'den 20:00-06:00 TRT'ye genisletildi
# - eski (04:00-01:00 TRT = gunde 21 saat) pencere TEK BASINA 750 saatlik
# paylasimli ucretsiz katman limitine (~750/30=25 saat/gun butce) ay
# sonunda carpip servisleri askiya aldirmisti (bkz. o gunku olay). Yeni
# pencere (06:00-20:00 TRT = gunde 14 saat) ayda ~420 saat tutuyor,
# guvenli bir marj birakiyor (bkz. health-watchdog.yml - frontend artik
# AYNI pencerede surekli degil, saatte bir kontrol ediliyor).
on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch: {}

jobs:
  pause:
    runs-on: ubuntu-latest
    # Secret'lar repo-level degil, "a" environment'ina bagli eklendi -
    # GitHub Actions environment-scoped secret'lari sadece bunu ACIKCA
    # belirten job'lara acar.
    environment: a
    steps:
      - name: UptimeRobot monitorunu duraklat
        run: |
          response=$(curl -s -X POST https://api.uptimerobot.com/v2/editMonitor \
            -d "api_key=${{ secrets.UPTIMEROBOT_API_KEY }}" \
            -d "id=${{ secrets.UPTIMEROBOT_MONITOR_ID }}" \
            -d "status=0" \
            -d "format=json")
          echo "$response"
          echo "$response" | grep -q '"stat":"ok"' || (echo "UptimeRobot API basarisiz oldu" && exit 1)
