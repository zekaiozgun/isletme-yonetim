name: UptimeRobot - Gece Duraklat (01:00 TRT)

# Turkiye UTC+3'te sabit (DST yok) - 01:00 TRT = 22:00 UTC (bir onceki gun).
# 2026-08-28: pencere 01:00-04:00 TRT'den 20:00-06:00 TRT'ye (gunde 14
# saat) daraltilmisti - eski genis pencere (04:00-01:00 TRT = gunde 21
# saat) frontend'in DE Render'da surekli uyanik tutulmasiyla BIRLIKTE
# 750 saatlik paylasimli ucretsiz katman limitini asip servisleri askiya
# aldirmisti (bkz. o gunku olay).
# 2026-09-01: frontend artik Render'da DEGIL, Vercel'de (bkz.
# health-watchdog.yml) - butceyi artik SADECE backend kullaniyor, bu
# yuzden pencere guvenle eski genis haline (04:00-01:00 TRT, gunde 21
# saat) geri dondu. Backend tek basina ayda ~638 saat tutuyor, 750
# saatlik sinirin ~112 saat altinda guvenli bir marj birakiyor.
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}

jobs:
  pause:
    runs-on: ubuntu-latest
    # Secret'lar repo-level degil, "a" environment'ina bagli eklendi -
    # GitHub Actions environment-scoped secret'lari sadece bunu ACIKCA
    # belirten job'lara acar.
    environment: a
    steps:
      - name: UptimeRobot monitorunu duraklat
        run: |
          response=$(curl -s -X POST https://api.uptimerobot.com/v2/editMonitor \
            -d "api_key=${{ secrets.UPTIMEROBOT_API_KEY }}" \
            -d "id=${{ secrets.UPTIMEROBOT_MONITOR_ID }}" \
            -d "status=0" \
            -d "format=json")
          echo "$response"
          echo "$response" | grep -q '"stat":"ok"' || (echo "UptimeRobot API basarisiz oldu" && exit 1)
