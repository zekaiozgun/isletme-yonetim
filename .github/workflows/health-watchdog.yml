name: Saglik Bekcisi - Gun Boyu Otomatik Kurtarma

# Gece-sonu is akisi (uptimerobot-night-resume.yml) SADECE 06:00 TRT'de
# calisiyor - gun icinde herhangi bir saatte backend VEYA frontend
# "hibernate-wake-error" turu bir takilmaya girerse (normal soguk
# baslangictan farkli: kendiliginden duzelmiyor - bkz. 2026-08-24 ~4.5
# saat, 2026-08-28 ~2-3 saat olaylari) hicbir otomasyon fark etmiyordu,
# sadece bir kullanicinin fark edip beklemesi/elle restart etmesi
# gerekiyordu. Bu is akisi, gun boyunca duzenli araliklarla backend'i
# (her calismada) ve frontend'i (SAATTE BIR - asagiya bkz.) kontrol
# edip, gercekten takili kaldiklarini tespit ederse (normal ~60sn'lik
# soguk baslangictan uzun suren bir basarisizlik) otomatik Render
# restart tetikler.
#
# 2026-08-28: "This service has been suspended" olayindan sonra YENIDEN
# ETKINLESTIRILDI, iki onemli degisiklikle: (1) atlama penceresi, yeni
# 20:00-06:00 TRT gece-duraklama penceresiyle eslesecek sekilde
# guncellendi; (2) frontend kontrolu artik HER 15 DAKIKADA BIR degil,
# SAATTE BIR calisiyor - backend zaten UptimeRobot tarafindan surekli
# uyanik tutuldugu icin backend kontrolunun ek maliyeti yok (mevcut
# uyanik duruma "biniyor"), ama frontend'i her 15 dakikada bir yoklamak
# onu SUREKLI uyanik tutup (750 saatlik paylasimli ucretsiz katman
# butcesini) tek basina asmaya yetiyordu - saatte bir yoklama, kontroller
# arasinda dogal olarak uykuya donmesine izin verir, sadece kisa bir
# "yoklama + ~15dk" maliyeti ekler.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  watchdog:
    runs-on: ubuntu-latest
    # Secret'lar repo-level degil, "a" environment'ina bagli eklendi -
    # GitHub Actions environment-scoped secret'lari sadece bunu ACIKCA
    # belirten job'lara acar.
    environment: a
    steps:
      - name: Gece duraklama penceresinde atla (uptimerobot-night-pause/resume ile AYNI pencere)
        id: window
        run: |
          # 17:00 UTC (20:00 TRT) - 03:00 UTC (06:00 TRT) arasi, backend
          # UptimeRobot monitoru zaten duraklatilmis durumda (bkz.
          # uptimerobot-night-pause.yml). Bu bekci de o pencerede ping
          # atmaya devam ederse, hem backend'i hem frontend'i suni olarak
          # uyanik tutup gece-uykusuyla hedeflenen saat tasarrufunu
          # bosa cikarir - o yuzden bu pencerede TAMAMEN atlanir.
          hour=$(date -u +%H)
          if [ "$hour" -ge 17 ] || [ "$hour" -lt 3 ]; then
            echo "Gece duraklama penceresindeyiz (UTC saat: $hour), bekci atlaniyor."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          # Saatin ilk 15-dakikalik dilimindeysek (dakika < 15) bu, o
          # saatin "ilk" calismasi sayilir - frontend kontrolu SADECE bu
          # calismada yapilir (yaklasik saatte bir), 15/30/45. dakika
          # calismalarinda atlanir. Backend her calismada kontrol edilir
          # (ek maliyeti yok - bkz. yukaridaki aciklama).
          minute=$(date -u +%M)
          if [ "$minute" -lt 15 ]; then
            echo "check_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "check_frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Backend saglik durumunu kontrol et, gercekten takiliysa restart tetikle
        if: steps.window.outputs.skip != 'true'
        run: |
          check_and_heal() {
            local name="$1"
            local url="$2"
            local service_id="$3"

            # Tek basarisiz denemeyle restart TETIKLENMEZ - normal soguk
            # baslangic da (Render'a gore 50sn+) kisa sureli basarisizlik
            # uretebilir. 3 deneme, 20sn arayla (~1 dakika toplam) normal
            # bir soguk baslangici, gercek bir takilmadan ayirt etmeye
            # yeter (normal baslangic bu sure icinde biter).
            local attempts=3
            local i
            for i in $(seq 1 "$attempts"); do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
              echo "[$name] Deneme $i/$attempts: HTTP $status"
              if [ "$status" = "200" ]; then
                echo "[$name] saglikli."
                return 0
              fi
              sleep 20
            done

            echo "[$name] $attempts denemede de saglikli degil (~1 dakikadir erisilemiyor) - Render restart tetikleniyor."
            restart_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/${service_id}/restart" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")
            echo "[$name] Render restart istegi HTTP $restart_status dondu"
          }

          check_and_heal "backend" "https://isletme-yonetim.onrender.com/health" "srv-d9f5kggk1i2s73bfsgtg"

      - name: Frontend saglik durumunu kontrol et (saatte bir), gercekten takiliysa restart tetikle
        if: steps.window.outputs.skip != 'true' && steps.window.outputs.check_frontend == 'true'
        run: |
          check_and_heal() {
            local name="$1"
            local url="$2"
            local service_id="$3"
            local attempts=3
            local i
            for i in $(seq 1 "$attempts"); do
              status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo "000")
              echo "[$name] Deneme $i/$attempts: HTTP $status"
              if [ "$status" = "200" ]; then
                echo "[$name] saglikli."
                return 0
              fi
              sleep 20
            done

            echo "[$name] $attempts denemede de saglikli degil (~1 dakikadir erisilemiyor) - Render restart tetikleniyor."
            restart_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              "https://api.render.com/v1/services/${service_id}/restart" \
              -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}")
            echo "[$name] Render restart istegi HTTP $restart_status dondu"
          }

          check_and_heal "frontend" "https://isletme-yonetim-web.onrender.com/login" "srv-d9fmq2f41pts73ei1ol0"
