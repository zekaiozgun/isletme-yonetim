name: Backend Test ve Lint
on:
  push:
    branches: [main]
    paths: ["apps/api/**"]
  pull_request:
    paths: ["apps/api/**"]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -v
